version: '3.8'

services:
  clash-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clash-royale-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Berlin
      - DATABASE_PATH=/app/data/clashbot.db
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
